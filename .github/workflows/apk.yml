name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le jeu
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Créer le projet Android
        run: |
          mkdir -p android/app/src/main/java/fr/les5rois/jeu android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cd android
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Les5Rois'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          echo 'org.gradle.jvmargs=-Xmx2g' > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'fr.les5rois.jeu'
              compileSdk 34
              defaultConfig {
                  applicationId 'fr.les5rois.jeu'
                  minSdk 24
                  targetSdk 34
                  versionCode Integer.parseInt(project.findProperty('vc') ?: '1')
                  versionName "1.${project.findProperty('vc') ?: '1'}"
              }
              buildTypes { release { minifyEnabled false } }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:label="Les 5 Rois"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen">
                  <activity