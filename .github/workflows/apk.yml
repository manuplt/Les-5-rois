name: Construire l'APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Projet Android
        run: |
          J=android/app/src/main/java/fr/les5rois/jeu
          mkdir -p $J android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cd android
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositories { google(); mavenCentral() } }" >> settings.gradle
          echo "include ':app'" >> settings.gradle
          echo "plugins { id 'com.android.application' version '8.5.2' apply false }" > build.gradle
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'fr.les5rois.jeu'
            compileSdk 34
            defaultConfig {
              applicationId 'fr.les5rois.jeu'
              minSdk 24
              targetSdk 34
              versionCode Integer.parseInt(project.findProperty('vc') ?: '1')
              versionName "1.${project.findProperty('vc') ?: '1'}"
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="Les 5 Rois" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/fr/les5rois/jeu/MainActivity.java <<'EOF'
          package fr.les5rois.jeu;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
            private WebView web;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              web = new WebView(this);
              web.setBackgroundColor(0xFF05060F);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              setContentView(web);
              web.loadUrl("file:///android_asset/index.html");
            }
            @Override protected void onPause() { super.onPause(); web.onPause(); }
            @Override protected void onResume() { super.onResume(); web.onResume(); }
          }
          EOF
      - name: Icônes
        run: |
          pip install -q pillow
          python3 -c "
          from PIL import Image; import os
          im = Image.open('icon.png')
          for n, s in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              d = 'android/app/src/main/res/mipmap-' + n; os.makedirs(d, exist_ok=True)
              im.resize((s, s)).save(d + '/ic_launcher.png')
          "
      - name: Construire et signer
        run: |
          cd android && gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon && cd ..
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore r.jks -storepass les5rois -keypass les5rois -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Les 5 Rois"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk a.apk
          "$BT/apksigner" sign --ks r.jks --ks-pass pass:les5rois --ks-key-alias k --out les-5-rois.apk a.apk
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.${{ github.run_number }}" les-5-rois.apk --title "Les 5 Rois 1.${{ github.run_number }}" --notes "APK Android" --latest