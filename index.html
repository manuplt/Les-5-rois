    <style>/* Thèmes de néons : cyan (défaut), rose, vert */
:root {
    --ink: #05060f;
    --c1: 34,211,238; --c1l: 103,232,249; --c1xl: 207,250,254; --c1d: 6,182,212;
    --c2: 167,139,250; --c2d: 124,58,237; --c2l: 221,214,254;
}
:root[data-theme="rose"] {
    --c1: 244,114,182; --c1l: 249,168,212; --c1xl: 252,231,243; --c1d: 219,39,119;
    --c2: 56,189,248; --c2d: 2,132,199; --c2l: 186,230,253;
}
:root[data-theme="vert"] {
    --c1: 52,211,153; --c1l: 110,231,183; --c1xl: 209,250,229; --c1d: 5,150,105;
    --c2: 96,165,250; --c2d: 37,99,235; --c2l: 191,219,254;
}
.text-c1 { color: rgb(var(--c1l)); }
.border-c1 { border-color: rgba(var(--c1),0.7) !important; }
.focus\:border-c1:focus { border-color: rgba(var(--c1),0.8); }
.ring-c1 { --tw-ring-color: rgb(var(--c1)); }
.bg-c1-soft { background: rgba(var(--c1),0.1); }
.score-best { text-shadow: 0 0 12px rgba(var(--c1),0.8); }
.meld-target { animation: meldPulse 1s ease-in-out infinite; }
@keyframes meldPulse { 50% { box-shadow: 0 0 18px rgba(var(--c1),0.8); } }
body {
    touch-action: manipulation;
    overscroll-behavior-y: contain;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-color: var(--ink);
    -webkit-tap-highlight-color: transparent;
}
.scrollbar-hide::-webkit-scrollbar { display: none; }
.scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
.font-display { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.01em; }

/* Animations des cartes */
@keyframes drawAnim {
    0% { transform: translateY(-150px) scale(0.5) rotateY(180deg); opacity: 0; }
    100% { transform: none; opacity: 1; }
}
@keyframes discardAnim {
    0% { transform: scale(1.2) translateY(-20px); opacity: 0.5; }
    100% { transform: none; opacity: 1; }
}
.animate-draw { animation: drawAnim 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards; }
.animate-discard { animation: discardAnim 0.3s ease-out backwards; }
@keyframes dealIn {
    0% { opacity: 0; transform: translateY(90px) scale(0.6) rotateX(60deg); }
    100% { opacity: 1; transform: none; }
}
.animate-deal { animation: dealIn 0.35s cubic-bezier(.2,.9,.3,1.2) backwards; }
@keyframes pulseActive {
    0%, 100% { box-shadow: 0 0 0 2px rgba(var(--c1),0.9), 0 0 14px rgba(var(--c1),0.6); }
    50% { box-shadow: 0 0 0 2px rgba(165,243,252,1), 0 0 26px rgba(var(--c1),0.95); }
}
.anim-bot-active { animation: pulseActive 1.4s ease-in-out infinite; border-color: transparent !important; }

/* Texte néon */
.neon-text {
    background: linear-gradient(90deg, rgb(var(--c1l)), rgb(var(--c2l)));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(var(--c1),0.35));
}
.wild-face { color: #0f172a; }
.title-neon {
    background: linear-gradient(90deg, rgb(var(--c1l)) 0%, #e0f2fe 25%, rgb(var(--c2)) 50%, #e0f2fe 75%, rgb(var(--c1l)) 100%);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(var(--c1),0.45)) drop-shadow(0 0 40px rgba(var(--c2),0.35));
    animation: shimmer 6s linear infinite;
    font-weight: 900; letter-spacing: -0.02em;
}
@keyframes shimmer { to { background-position: 200% center; } }

/* Surfaces en verre */
.glass-panel {
    background: rgba(10,12,30,0.78);
    border: 1px solid rgba(var(--c2),0.28);
    box-shadow: 0 0 0 1px rgba(var(--c1),0.06) inset, 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(var(--c2d),0.12);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.top-bar {
    background: linear-gradient(180deg, rgba(5,6,15,0.92), rgba(5,6,15,0.55));
    border-bottom: 1px solid rgba(var(--c1),0.18);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.chip { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
.chip-danger { background: rgba(244,63,94,0.15); color: #fda4af; border: 1px solid rgba(244,63,94,0.55); box-shadow: 0 0 12px rgba(244,63,94,0.35); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.55; } }
.bubble {
    background: rgba(10,12,30,0.72); color: #e2e8f0;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.bubble-active { color: rgb(var(--c1xl)); border-color: rgba(var(--c1),0.7); box-shadow: 0 0 16px rgba(var(--c1),0.45); }
.bubble-error { color: #ffe4e6; border-color: rgba(244,63,94,0.8); box-shadow: 0 0 16px rgba(244,63,94,0.5); background: rgba(60,8,20,0.8); }
.bubble-in { animation: bubbleIn .25s ease-out both; }
@keyframes bubbleIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.hand-panel {
    background: linear-gradient(180deg, rgba(12,14,34,0.94), rgba(5,6,15,0.98));
    box-shadow: 0 -1px 0 rgba(var(--c1),0.45), 0 -18px 40px rgba(0,0,0,0.6), 0 -6px 30px rgba(var(--c1),0.08);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.menu-item { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; }
.menu-item:hover, .menu-item:active { background: rgba(var(--c1),0.12); color: rgb(var(--c1xl)); }
.dropdown-in { animation: bubbleIn .15s ease-out both; transform-origin: top right; }

/* Boutons */
.icon-btn {
    border-radius: 9999px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);
    color: #e2e8f0; font-weight: 800; transition: transform .1s, border-color .2s;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn:hover { border-color: rgba(var(--c1),0.6); }
.btn-primary {
    background: linear-gradient(180deg, rgb(var(--c1l)), rgb(var(--c1d))); color: #031018; border: 1px solid rgb(var(--c1xl));
    box-shadow: 0 0 18px rgba(var(--c1),0.55);
}
.btn-ghost { background: rgba(255,255,255,0.04); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.16); }
.btn-ghost:hover { border-color: rgba(var(--c1),0.6); }
.btn-violet {
    background: linear-gradient(180deg, rgb(var(--c2)), rgb(var(--c2d))); color: #fff; border: 1px solid rgb(var(--c2l));
    box-shadow: 0 0 20px rgba(var(--c2d),0.6);
}
.btn-danger {
    background: linear-gradient(180deg, #fb7185, #e11d48); color: #fff; border: 1px solid #fecdd3;
    box-shadow: 0 0 20px rgba(244,63,94,0.6);
}
.avatar-ring {
    border-radius: 9999px; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, #2a2460, #0a0b1e);
    border: 2px solid rgba(var(--c2),0.8);
    box-shadow: 0 0 14px rgba(var(--c2),0.35);
}

/* Cartes blanches épurées */
.pcard {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    box-shadow: 0 6px 14px rgba(0,0,0,0.45);
}
.card-joker { background: #ffffff; }
.card-wild { box-shadow: inset 0 0 0 2px #fbbf24, 0 0 14px rgba(251,191,36,0.55), 0 6px 14px rgba(0,0,0,0.45); }
.wild-badge { background: #fbbf24; box-shadow: 0 0 10px rgba(251,191,36,0.8); }
.card-selected {
    box-shadow: 0 0 0 2px rgb(var(--c1)), 0 0 22px rgba(var(--c1),0.85), 0 14px 22px rgba(0,0,0,0.5) !important;
}
.card-sheen {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(115deg, transparent 25%, rgba(251,191,36,0.25) 45%, rgba(255,255,255,0.6) 50%, rgba(251,191,36,0.25) 55%, transparent 75%);
    background-size: 250% 100%;
    animation: holo 3.2s linear infinite;
}
@keyframes holo { from { background-position: 100% 0; } to { background-position: -150% 0; } }
.card-back-css {
    background: linear-gradient(135deg, #1e1b4b, #0b1026);
    border: 2px solid rgb(var(--c1)); box-shadow: 0 0 14px rgba(var(--c1),0.5);
}

/* Main du joueur */
.hand-slot { transition: left .18s ease-out, transform .15s ease-out; will-change: left, transform; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.hand-slot.dragging { transition: transform .12s ease-out; filter: drop-shadow(0 18px 18px rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(var(--c1),0.6)); cursor: grabbing; }

/* Cinématiques */
.wild-reveal { animation: wildReveal 2s cubic-bezier(.2,.8,.2,1) both; }
@keyframes wildReveal {
    0% { opacity: 0; transform: scale(0.2) rotateY(540deg); }
    30% { opacity: 1; transform: scale(1.08) rotateY(0deg); }
    38% { transform: scale(1); }
    78% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: translate(-25vw, -46vh) scale(0.12); }
}
.rays {
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(var(--c1),0.35) 0deg 4deg, rgba(0,0,0,0) 4deg 15deg, rgba(var(--c2),0.35) 15deg 19deg, rgba(0,0,0,0) 19deg 30deg);
    -webkit-mask: radial-gradient(circle, #000 15%, transparent 68%);
    mask: radial-gradient(circle, #000 15%, transparent 68%);
    animation: spin 8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.cine-vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(2,3,10,0.82)); animation: fadeInOut 2.8s both; }
@keyframes fadeInOut { 0% { opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
.cine-flash { background: radial-gradient(circle, rgba(var(--c1xl),0.9), rgba(var(--c1),0.35) 40%, rgba(var(--c2d),0.15) 60%, transparent 75%); animation: flashAnim 1.1s ease-out both; }
@keyframes flashAnim { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 0; } }
.cine-title { animation: titleIn 2.8s cubic-bezier(.2,.9,.3,1.25) both; }
@keyframes titleIn {
    0% { opacity: 0; transform: scale(2.4); filter: blur(10px); letter-spacing: 0.4em; }
    18% { opacity: 1; transform: scale(1); filter: blur(0); letter-spacing: 0.02em; }
    85% { opacity: 1; transform: scale(1.03); }
    100% { opacity: 0; transform: scale(1.03) translateY(-24px); }
}
.crown-pop { animation: titleIn 2.8s both; }
.results-in { animation: fadeIn .4s ease-out both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.row-in { animation: rowIn .45s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes rowIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: none; } }

@media (max-height: 500px) {
    .hand-panel { padding-top: 0; padding-bottom: 2px; }
    .hand-actions { height: 2.5rem; margin-bottom: 0; }
    .menu-crown { height: 20vh; min-height: 90px; }
}
@media (prefers-reduced-motion: reduce) {
    .title-neon, .rays, .card-sheen, .chip-danger { animation: none; }
}

.menu-col > * { flex-shrink: 0; }
</style>
